name = "grok-bot-mcp"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

# Create the database with `npx wrangler d1 create grok-bot-mcp` and replace this id.
# Apply migrations/0001_create_jobs.sql with `npx wrangler d1 migrations apply grok-bot-mcp --remote`.
[[d1_databases]]
binding = "DB"
database_name = "grok-bot-mcp"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Non-secret defaults. Put real values in `wrangler secret` (see README).
WAIT_SECONDS = "25"
JOB_TTL_SECONDS = "86400"
MAX_MESSAGE_BYTES = "16384"
